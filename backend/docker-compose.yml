version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://dinereserve_user:dinereserve_pass@postgres:5432/dinereserve_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production-dinereserve-jwt-secret-key-9988
      - PORT=3000
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dinereserve_user
      POSTGRES_PASSWORD: dinereserve_pass
      POSTGRES_DB: dinereserve_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

volumes:
  pgdata:
  redisdata:
